name: Rebuild frontend artifacts

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'original.html'
      - 'build.py'
      - 'patches.py'
      - 'theme-assets/**'
      - 'src/ui/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-frontend
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependency
        run: python -m pip install pillow
      - name: Rebuild frontend
        run: python3 build.py
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html telegram/index.html app/icons
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore: rebuild frontend artifacts [skip ci]"
          git push
